<script>

/* ---------- renderer / scene ---------- */
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.5:2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.outputEncoding=THREE.sRGBEncoding;R.toneMappingExposure=1.1;

scene.fog=new THREE.Fog(HOR,70,270);
function cvs(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
scene.background=cvs(16,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#2d6bc9');g.addColorStop(.38,'#8fb8e8');g.addColorStop(.5,HOR);g.addColorStop(1,HOR);x.fillStyle=g;x.fillRect(0,0,w,h)});

const GT=cvs(64,64,(x)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64)});

/* road + ground */
const AN=R.capabilities.getMaxAnisotropy(),HW=7.6;
const roadT=cvs(512,512,(x,w,h)=>{x.fillStyle='#3b3c42';x.fillRect(0,0,w,h);
 for(let i=0;i<9000;i++){x.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.12)';x.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}
 const u=m=>(m+HW)/(2*HW)*w;
 for(const c of[-LW*1.5,-LW*.5,LW*.5,LW*1.5]){const g=x.createLinearGradient(u(c-.9),0,u(c+.9),0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,'rgba(0,0,0,.22)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(u(c-.9),0,u(c+.9)-u(c-.9),h)}
 x.fillStyle='#e8e8ea';for(const e of[-6.35,6.2])x.fillRect(u(e),0,.16*w/(2*HW),h);
 x.fillStyle='#e8b81c';x.fillRect(u(-.28),0,.12*w/(2*HW),h);x.fillRect(u(.16),0,.12*w/(2*HW),h);

let grT=cvs(256,256,(x,w,h)=>{x.fillStyle='#4b7a38';x.fillRect(0,0,w,h);for(let i=0;i<5000;i++){x.fillStyle=['#3f6b2f','#5a8a42','#44722f','#6a9650'][i&3];x.globalAlpha=.5;x.fillRect(Math.random()*w,Math.random()*h,2,3)}});

gr.rotation.x=-Math.PI/2;gr.position.set(0,-.03,-170);gr.receiveShadow=true;scene.add(gr);

const MTN=[];for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(70+Math.random()*60,60+Math.random()*60,5),mm);m.position.set(-380+i*95+Math.random()*40,25,-410);scene.add(m);MTN.push(m)}

function mkCar(o){
 const g=new THREE.Group(),body=new THREE.MeshPhysicalMaterial({color:o.col,metalness:.55,roughness:.3,clearcoat:1,clearcoatRoughness:.08}),tl=o.player?new THREE.MeshBasicMaterial({color:0xcc1515}):TL;

 }else{
  B(g,1.8,.5,4.2,0,.55,0,body);B(g,1.76,.14,1.2,0,.84,-1.35,body);B(g,1.5,.46,2.1,0,1.06,.25,glass);B(g,1.42,.07,1.6,0,1.31,.25,body);
  B(g,1.82,.18,.2,0,.4,2.1,blk);B(g,1.82,.18,.2,0,.4,-2.1,blk);

 }
 if(o.player){g.tl=tl;g.fl=new THREE.Group();const fm=new THREE.MeshBasicMaterial({color:0xffa030});

  g.fl.visible=false;g.add(g.fl)}
 return g}

 $('nb').style.width=(S.nitro/S.nmax*100)+'%';const g=S.goal;$('obj').textContent=g?(g.type==='dist'?(S.dist/1000).toFixed(2)+' / '+g.goal+' km':g.type==='near'?S.near+' / '+g.goal+' near misses':Math.floor(S.score)+' / '+g.goal+' pts')+'  ·  '+Math.max(0,Math.ceil(S.tl))+'s':'';$('nb').style.background=S.boost?'#ff9a2a':'';

function resize(){R.setSize(innerWidth,innerHeight);RT.setSize(innerWidth*R.getPixelRatio(),innerHeight*R.getPixelRatio());cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- mobile: touch controls, settings, fullscreen ---------- */
const TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
if(TOUCH)document.body.classList.add('touch');
addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});
document.addEventListener('gesturestart',e=>e.preventDefault());addEventListener('contextmenu',e=>{if(TOUCH)e.preventDefault()});
let CFG={mode:'joy',sens:1,inv:0,snd:1,blur:1},AX=0,TCAL=true,PAUSED=false,SF='l',TP=0,tiltN=0,TILTOK=false,TW=0,TWARN=0;
try{Object.assign(CFG,JSON.parse(localStorage.getItem('hr3_set')))}catch(e){}
muted=!CFG.snd;
function saveCfg(){try{localStorage.setItem('hr3_set',JSON.stringify(CFG))}catch(e){}}
function applyMode(){document.body.classList.toggle('tilt',CFG.mode==='tilt');document.body.classList.toggle('joy',CFG.mode!=='tilt');AX=0}
function askTilt(){if(CFG.mode==='tilt'&&!TP&&window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){TP=1;DeviceOrientationEvent.requestPermission().catch(()=>{})}}
applyMode();
addEventListener('deviceorientation',e=>{if(e.beta!=null)TILTOK=true;if(CFG.mode!=='tilt'||e.beta==null)return;const a=(screen.orientation&&screen.orientation.angle)||window.orientation||0,t=(a===90||a===-270)?e.beta:(a===270||a===-90)?-e.beta:e.gamma;
 if(TCAL){tiltN=t;TCAL=false}let d=t-tiltN;if(CFG.inv)d=-d;const rg=[32,24,16][CFG.sens]||24;d=Math.abs(d)<1.5?0:d;AX=Math.max(-1,Math.min(1,d/rg))});
const joy=$('joy'),knob=$('knob');let jp=null;
const jm=e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,m=r.width/2-12;let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}knob.style.transform='translate('+dx+'px,'+dy+'px)';const v=dx/m;AX=Math.abs(v)<.08?0:v};
joy.addEventListener('pointerdown',e=>{e.preventDefault();jp=e.pointerId;joy.setPointerCapture(e.pointerId);jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jp)jm(e)});
const je=e=>{if(e.pointerId===jp){jp=null;AX=0;knob.style.transform=''}};joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
function hold(id,code){const el=$(id),up=()=>{keys[code]=0;el.classList.remove('p')};el.addEventListener('pointerdown',e=>{e.preventDefault();aud();el.setPointerCapture(e.pointerId);keys[code]=1;el.classList.add('p')});el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}
hold('bAcc','ArrowUp');hold('bBrk','ArrowDown');hold('bNos','ShiftLeft');
function toast(t){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,4500)}
function toggleFS(){const d=document.documentElement,fs=document.fullscreenElement||document.webkitFullscreenElement;
 if(fs){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}return}
 const rq=d.requestFullscreen||d.webkitRequestFullscreen||d.webkitRequestFullScreen||d.mozRequestFullScreen||d.msRequestFullscreen;
 const fail=()=>{let fr=false;try{fr=window.top!==window.self}catch(e){fr=true}
  if(fr){const w=window.open(location.href,'_blank');toast(w?'Fullscreen is blocked inside this frame - opened the game in its own tab, press the fullscreen button there':'Fullscreen is blocked inside this frame - open the game link directly in your browser, then press the button again')}
  else toast('Fullscreen is not available in this browser. On iPhone use Share > Add to Home Screen')};
 if(!rq){fail();return}
 try{const p=rq.call(d);if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(fail);else setTimeout(()=>{if(!(document.fullscreenElement||document.webkitFullscreenElement))fail()},500)}catch(e){fail()}}
$('bFs').onclick=toggleFS;$('bSet').onclick=()=>{aud();if(PAUSED)resume();else if(S.mode==='play')settings('p');else settings('l')};
function settings(f){f=f||'l';SF=f;if(f==='p'&&!PAUSED&&S.mode==='play'){PAUSED=true;if(mg)mg.gain.value=0}
 const q=x=>typeof x==='string'?"'"+x+"'":x,tg=(k,vs)=>vs.map(v=>'<button class="btn'+(CFG[k]===v[0]?' on':'')+'" style="min-width:0;padding:10px 20px" onclick="setC(\''+k+'\','+q(v[0])+')">'+v[1]+'</button>').join(''),
 tl=CFG.mode==='tilt'?'<p>Tilt sensitivity</p><div class="row">'+tg('sens',[[0,'Low'],[1,'Medium'],[2,'High']])+'</div><div class="row">'+tg('inv',[[0,'Normal'],[1,'Inverted']])+'<button class="btn" style="min-width:0;padding:10px 20px" onclick="TCAL=true">Recalibrate</button></div>':'';
 setOv('<h2 style="margin:0;font-size:40px">SETTINGS</h2><p>Steering</p><div class="row">'+tg('mode',[['joy','Joystick'],['tilt','Tilt']])+'</div>'+tl+'<p>Sound</p><div class="row">'+tg('snd',[[1,'On'],[0,'Off']])+'</div><p>Motion blur</p><div class="row">'+tg('blur',[[1,'On'],[0,'Off']])+'</div><div class="row"><button class="btn" onclick="'+(f==='p'?'resume()':'lobby()')+'">'+(f==='p'?'RESUME':'BACK')+'</button><button class="btn" onclick="window.open(location.href)">NEW TAB</button></div>','side')}
function setC(k,v){CFG[k]=v;saveCfg();if(k==='snd'){muted=!v;if(mg&&!PAUSED)mg.gain.value=muted?0:.9}if(k==='mode'){applyMode();askTilt();TCAL=true}settings(SF)}
function tiltCheck(){const bad=CFG.mode==='tilt'&&!TILTOK;if(bad&&S.mode==='play'&&!PAUSED){TW+=DT;if(TW>1.5&&!TWARN){TWARN=1;toast('Tilt sensors are blocked here (inside the Claude page). Use the on-screen joystick, or open the game in its own tab for real tilt.')}}
 document.body.classList.toggle('nosensor',bad&&TW>1.5);$('tbar').style.display=CFG.mode==='tilt'&&S.mode==='play'?'block':'none';$('tbi').style.left=(50+AX*50)+'%'}
function resume(){PAUSED=false;if(mg)mg.gain.value=muted?0:.9;setOv('')}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;DT=dt;if(!PAUSED)update(dt);audioTick();render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
